# CI — the second item on this project's own "not production-ready" list, which read:
# "No .github/workflows; nothing stops a broken build reaching production except running
# `next build` by hand." Now something does.
#
# Deliberately small. It runs exactly the four checks that have actually caught things during
# development — typecheck, lint, the engine's tests, and a real production build — and nothing
# aspirational. A CI file full of jobs nobody maintains is worse than none, because a red tick
# people learn to ignore is indistinguishable from no tick at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. The root package.json already declares
      # `packageManager: pnpm@9.12.0`, and specifying both makes this action fail
      # outright — "Multiple versions of pnpm specified" — rather than picking one.
      # Letting it read `packageManager` keeps the version in a single place, which
      # is also what the local dev scripts and Vercel resolve against.
      - uses: pnpm/action-setup@v6

      # v7 across the board: the v4 actions were being forced onto Node 24 with a
      # deprecation warning on every run, because Node 20 is end-of-life on GitHub
      # runners. A warning nobody can act on trains people to ignore warnings.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages are consumed as compiled dist/, not source — the trap documented in
      # CLAUDE.md that cost an afternoon twice. Anything downstream typechecks against stale
      # output unless the workspace is built first, so this must come before the checks.
      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" build

      # Everything except `web`. Next generates `next-env.d.ts` — which is what types a
      # `.jpg` import — during a build, and that file is gitignored, so on a clean checkout
      # `tsc --noEmit` in apps/web cannot resolve the hero image and fails. Rather than
      # commit a generated file or build before typechecking, web is covered by the
      # production build below: `next build` runs full TypeScript checking and this config
      # sets no `ignoreBuildErrors`, so a type error there still fails CI.
      - name: Typecheck
        run: pnpm -r --filter "!web" typecheck

      - name: Lint
        run: pnpm -r lint
        continue-on-error: true

      # The 23 tests on the tax engine — the part that most needs them, and the part a
      # customer is paying for through the API.
      - name: Test the engine
        run: pnpm --filter @veela/core test

      # `next build` with no secrets configured. This is the check that proves the
      # zero-configuration rule still holds: the app must compile without Supabase, without
      # a Maps key and without an AI provider, or every one of those fallbacks is a fiction.
      - name: Production build, with nothing configured
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
